server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # фото грибов до 5 МБ (лимит API), по умолчанию nginx пропускает только 1 МБ
    client_max_body_size 6m;

    # статика сайта
    location / {
        try_files $uri $uri/ =404;
    }

    # API и документация (Swagger/ReDoc) — в контейнер api
    location ~ ^/(api/|docs|redoc|openapi\.json|docs-assets/) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
